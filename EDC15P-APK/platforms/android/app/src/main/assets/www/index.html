<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: gap: blob: cdvfile:; style-src * 'self' 'unsafe-inline'; script-src * 'self' 'unsafe-inline' 'unsafe-eval';">
    
    <meta name="description" content="EDC15P+ Tool - 100% Offline">
    <meta name="theme-color" content="#667eea">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    
    <title>EDC15P+ Tool</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
            color: #2c3e50;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 25px;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            text-align: center;
        }
        .header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
            color: #667eea;
        }
        .offline-badge {
            display: inline-block;
            background: #48bb78;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-top: 10px;
        }
        .cordova-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.75em;
            margin-left: 5px;
        }
        .main-content {
            background: white;
            padding: 20px;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .section {
            margin-bottom: 20px;
        }
        .section h2 {
            color: #2c3e50;
            margin-bottom: 12px;
            font-size: 1.1em;
            border-left: 4px solid #667eea;
            padding-left: 10px;
        }
        .upload-area {
            border: 3px dashed #cbd5e0;
            border-radius: 10px;
            padding: 30px 20px;
            text-align: center;
            background: #f7fafc;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover, .upload-area.drag-active {
            border-color: #667eea;
            background: #edf2f7;
        }
        .upload-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            padding: 14px 25px;

            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
            touch-action: manipulation;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover:not(:disabled), .btn-primary:active:not(:disabled) {
            background: #5568d3;
        }
        .btn-success {
            background: #48bb78;
            color: white;
        }
        .btn-success:hover:not(:disabled), .btn-success:active:not(:disabled) {
            background: #38a169;
        }
        .btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 10px 0;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 12px;
            background: #f7fafc;
            border-radius: 5px;

        .info-box {
            background: #e6fffa;
            border-left: 4px solid #48bb78;
            padding: 12px;
            border-radius: 5px;

            font-size: 0.95em;
        }
        .warning-box {
            background: #fff5f5;
            border-left: 4px solid #f56565;
            padding: 12px;
            border-radius: 5px;
            margin: 12px 0;
            font-size: 0.9em;
        }
        .results {
            background: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            margin: 12px 0;
            display: none;
        }
        .results.show {
            display: block;
        }
        .result-item {
            margin: 8px 0;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1em;
            background: white;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1em;
        }
        .loader {
            border: 4px solid #f3f3f3;

            border-radius: 50%;

            height: 40px;

            margin: 20px auto;
            display: none;

        @keyframes spin {

        .hidden {

        }
        .status-bar {
            background: #2c3e50;
            color: white;
            padding: 8px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 0.85em;
            text-align: center;
        }
        @media (max-width: 768px) {
            body { padding: 10px; }
            .header h1 { font-size: 1.4em; }
            .main-content { padding: 15px; }
            .btn { width: 100%; margin: 5px 0; }
            .radio-group { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 EDC15P+ IMMO & DTC Tool</h1>
    
        </div>
        <div class="main-content">
            <!-- Status Bar -->

            </div>
            <!-- Warning -->

            <!-- Upload Section -->

            <!-- DTC Options -->
            <div class="section">
                <h2>🔧 3. DTCs</h2>
                <label><strong>Common DTCs:</strong></label>
                <select id="commonDtcSelect" size="5" multiple>
                    <option value="17105">P0721 - Output Speed Sensor</option>
                    <option value="16502">P0118 - Coolant Temp High</option>
                    <option value="16705">P0321 - Engine Speed Sensor</option>
                    <option value="17109">P0725 - Engine Speed Circuit</option>
                    <option value="16486">P0102 - MAF Signal Low</option>
                    <option value="18048">P1640 - EEPROM Error</option>
                    <option value="17965">P1557 - Idle Adaptation</option>
                    <option value="16500">P0116 - Coolant Temp Range</option>
                    <option value="17090">P0706 - Trans Range Sensor</option>

                <small style="color: #718096;">💡 Hold to select multiple</small>

            <!-- Process Results -->
            <div id="processResults" class="results">

                <div id="processContent"></div>
                <div style="text-align: center; margin-top: 15px;">
                    <button class="btn btn-success" id="downloadBtn">

                    <button class="btn btn-primary" id="downloadReportBtn">
                        📄 Save Report

            </div>
        </div>
    </div>
    <!-- Cordova -->
    <script src="cordova.js"></script>
    
    <script>
        // EDC15P+ Tool - Cordova Android Version
        const IMMO_ON = [0x08, 0x00, 0x2C, 0x01, 0x08];
        const IMMO_OFF = [0x08, 0x00, 0x2C, 0xFF, 0x08];
        // App state
        let isCordovaReady = false;
        let fileSystemReady = false;
        let downloadDirectory = null;
        let permissionsGranted = false;
        // Wait for Cordova
        document.addEventListener('deviceready', onDeviceReady, false);
        
        // Fallback para browser
        setTimeout(() => {
            if (!isCordovaReady) {
                console.log('Browser Mode - Cordova not available');
                updateStatus('🌐 Browser Mode (Downloads via browser)');
                document.getElementById('cordovaBadge').textContent = 'Browser';
                document.getElementById('cordovaBadge').style.background = '#f59e0b';
            }
        }, 3000);
        function onDeviceReady() {
            isCordovaReady = true;
            console.log('Cordova ready!');
            console.log('File plugin:', window.cordova && window.cordova.file ? 'OK' : 'NO');
            
            document.getElementById('cordovaBadge').textContent = 'Cordova ✓';
            
            // Request permissions first
            requestPermissions();
        }
        var permissionsRequested = false;
        function requestPermissions() {
            updateStatus('🔐 Checking permissions...');
            
            const permissions = cordova.plugins && cordova.plugins.permissions;
            
            if (!permissions) {
                console.log('Permissions plugin not available');
                initFileSystem();
                return;
            }
            // Check if permission is already granted
            const permissionList = [
                permissions.WRITE_EXTERNAL_STORAGE,
                permissions.READ_EXTERNAL_STORAGE
            ];
            permissions.checkPermission(permissions.WRITE_EXTERNAL_STORAGE, function(status) {
                if (status.hasPermission) {
                    console.log('Permissions already granted');
                    permissionsGranted = true;
                    initFileSystem();
                } else {
                    // Only request permissions if not requested in this session
                    if (!permissionsRequested) {
                        permissionsRequested = true;
                        permissions.requestPermissions(permissionList, 
                            function(status) {
                                permissionsGranted = status.hasPermission;
                                initFileSystem();
                            },
                            function(error) {
                                console.log('Error:', error);
                                initFileSystem();
                            }
                        );
                    } else {
                        initFileSystem();
                    }
                }
            }, function(error) {
                initFileSystem();
            });
        }
        function openAppSettings() {
            if (cordova.plugins && cordova.plugins.settings) {
                cordova.plugins.settings.open('application_details', 
                    function() { console.log('Settings opened'); },
                    function() { alert('Open manually:\n\nSettings → Apps → EDC15P+ Tool'); }
                );
            } else {
                alert('Open manually:\n\nSettings → Apps → EDC15P+ Tool');
            }
        }
        function initFileSystem() {
            if (!window.cordova || !window.cordova.file) {
                updateStatus('⚠️ File plugin not available');
                return;
            }
            // Configure settings button
            var settingsBtn = document.getElementById('openSettingsBtn');
            if (settingsBtn) {
                settingsBtn.onclick = function() {
                    openAppSettings();
                };
            }
            // Use Android Downloads folder (if permissions granted)
            if (cordova.file.externalRootDirectory) {
                downloadDirectory = cordova.file.externalRootDirectory + 'Download/';
                fileSystemReady = true;
                console.log('Downloads directory:', downloadDirectory);
                updateStatus('✅ Ready! Files will go to Downloads');
            } else if (cordova.file.externalDataDirectory) {
                downloadDirectory = cordova.file.externalDataDirectory;
                fileSystemReady = true;
                console.log('Alternative directory:', downloadDirectory);
                updateStatus('✅ Ready! Select a .bin file');
            } else {
                updateStatus('⚠️ Downloads will use alternative method');
            }
        }
        function updateStatus(msg) {
            document.getElementById('statusBar').innerHTML = msg;
        }
        class ECU_Processor {
            constructor() {
                this.originalData = null;
                this.modifiedData = null;
                this.fileName = '';
                this.analysis = null;
            }
            findSequence(data, sequence) {
                const positions = [];
                for (let i = 0; i <= data.length - sequence.length; i++) {
                    let match = true;
                    for (let j = 0; j < sequence.length; j++) {
                        if (data[i + j] !== sequence[j]) {
                            match = false;
                            break;
                        }
                    }
                    if (match) positions.push(i);
                }
                return positions;
            }
            loadFile(file) {
                return new Promise((resolve, reject) => {
                    if (!file) {
                        reject(new Error('File not selected or invalid'));
                        return;
                    }
                    
                    const reader = new FileReader();
                    
                    reader.onload = (e) => {
                        try {
                            this.originalData = new Uint8Array(e.target.result);
                            this.modifiedData = new Uint8Array(this.originalData);
                            this.fileName = file.name;
                            console.log('File loaded:', this.originalData.length, 'bytes');
                            resolve(this.originalData);
                        } catch (err) {
                            reject(new Error('Error processing file: ' + err.message));
                        }
                    };
                    
                    reader.onerror = () => reject(new Error('Error reading file'));
                    reader.readAsArrayBuffer(file);
                });
            }
            analyze() {
                if (!this.originalData) throw new Error('No file loaded');
                const immoOnPos = this.findSequence(this.originalData, IMMO_ON);
                const immoOffPos = this.findSequence(this.originalData, IMMO_OFF);
                const ecuInfo = this.extractECUInfo();
                this.analysis = {
                    fileSize: this.originalData.length,
                    fileName: this.fileName,
                    immo: {
                        on: immoOnPos.length,
                        off: immoOffPos.length,
                        onPositions: immoOnPos,
                        offPositions: immoOffPos
                    },
                    ecuInfo: ecuInfo
                };
                return this.analysis;
            }
            extractECUInfo() {
                const info = {
                    partNumber: 'Not found',
                    software: 'Not found',
                    manufactureDate: 'Not found',
                    ecuType: 'EDC15P+'
                };
                let dataStr = '';
                for (let i = 0; i < this.originalData.length; i++) {
                    const byte = this.originalData[i];
                    dataStr += (byte >= 32 && byte <= 126) ? String.fromCharCode(byte) : '.';
                }
                const vagMatch = dataStr.match(/03[0-9]906[0-9]{3}[A-Z]{1,3}/);
                if (vagMatch) info.partNumber = vagMatch[0];
                if (info.partNumber === 'Not found') {
                    const boschMatch = dataStr.match(/0281[0-9]{6}/);
                    if (boschMatch) info.partNumber = boschMatch[0];
                }
                const versionMatch = dataStr.match(/[Vv]?[0-9]\.[0-9]{1,2}/);
                if (versionMatch) {
                    const idx = dataStr.indexOf(versionMatch[0]);
                    const context = dataStr.substring(Math.max(0, idx - 10), idx + 20).replace(/\./g, '').trim();
                    if (context.length >= 4 && context.length <= 30) {
                        info.software = context;
                    }
                }
                const dateMatch = dataStr.match(/\b([0-9]{2}\/[0-9]{2})\b/);
                if (dateMatch) info.manufactureDate = dateMatch[1];
                return info;
            }
            bytesToWords(data) {
                const words = [];
                for (let i = 0; i < data.length - 1; i += 2) {
                    words.push(data[i] | (data[i + 1] << 8));
                }
                return words;
            }
            wordsToBytes(words) {
                const bytes = new Uint8Array(words.length * 2);
                for (let i = 0; i < words.length; i++) {
                    bytes[i * 2] = words[i] & 0xFF;
                    bytes[i * 2 + 1] = (words[i] >> 8) & 0xFF;
                }
                return bytes;
            }
            applyImmoOff() {
                const positions = this.findSequence(this.modifiedData, IMMO_ON);
                let count = 0;
                for (const pos of positions) {
                    for (let i = 0; i < IMMO_OFF.length; i++) {
                        this.modifiedData[pos + i] = IMMO_OFF[i];
                    }
                    count++;
                }
                return count;
            }
            applyImmoOn() {
                const positions = this.findSequence(this.modifiedData, IMMO_OFF);
                let count = 0;
                for (const pos of positions) {
                    for (let i = 0; i < IMMO_ON.length; i++) {
                        this.modifiedData[pos + i] = IMMO_ON[i];
                    }
                    count++;
                }
                return count;
            }
            applyDtcOff(dtcCodes) {
                const words = this.bytesToWords(this.modifiedData);
                let patchCount = 0;
                for (const dtcCode of dtcCodes) {
                    const code = parseInt(dtcCode);
                    for (let i = 0; i < words.length; i++) {
                        if (words[i] === code) {
                            if (i >= 3) words[i - 3] = 65535;
                            if (i >= 2) words[i - 2] = 0;
                            patchCount += 2;
                        }
                    }
                }
                this.modifiedData = this.wordsToBytes(words);
                return patchCount;
            }
            process(options) {
                if (!this.originalData) throw new Error('No file loaded');
                this.modifiedData = new Uint8Array(this.originalData);
                
                let operations = [];
                let totalPatches = 0;
                if (options.immoMode === 'off') {
                    totalPatches += this.applyImmoOff();
                    operations.push('IMMO_OFF');
                } else if (options.immoMode === 'on') {
                    totalPatches += this.applyImmoOn();
                    operations.push('IMMO_ON');
                }
                if (options.dtcCodes && options.dtcCodes.length > 0) {
                    totalPatches += this.applyDtcOff(options.dtcCodes);
                    operations.push('DTC_OFF');
                }
                return {
                    success: totalPatches > 0,
                    operations: operations,
                    patchesApplied: totalPatches
                };
            }
            getModifiedFileName(operations = []) {
                const suffix = operations.length > 0 ? operations.join('_') : 'MODIFIED';
                const baseName = this.fileName.replace(/\.[^/.]+$/, '');
                return `${baseName}_${suffix}.bin`;
            }
            generateReport(operations, patchesApplied) {
                const date = new Date().toLocaleString('pt-PT');
                let report = '='.repeat(60) + '\n';
                report += 'EDC15P+ TOOL - REPORT\n';
                report += '='.repeat(60) + '\n\n';
                report += `Date: ${date}\n`;
                report += `Original File: ${this.fileName}\n`;
                report += `Size: ${this.originalData.length.toLocaleString()} bytes\n\n`;
                report += 'OPERATIONS:\n' + '-'.repeat(60) + '\n';
                for (const op of operations) report += `✓ ${op}\n`;
                report += '\n' + '-'.repeat(60) + '\n';
                report += `Total Patches: ${patchesApplied}\n\n`;
                
                if (this.analysis && this.analysis.ecuInfo) {
                    report += 'ECU INFO:\n' + '-'.repeat(60) + '\n';
                    report += `Type: ${this.analysis.ecuInfo.ecuType}\n`;
                    report += `Part Number: ${this.analysis.ecuInfo.partNumber}\n`;
                    report += `Software: ${this.analysis.ecuInfo.software}\n`;
                }
                
                report += '\n' + '='.repeat(60) + '\n';
                report += '⚠️ CORRECT THE CHECKSUM BEFORE FLASHING!\n';
                report += '='.repeat(60) + '\n';
                return report;
            }
            getDifferences() {
                if (!this.originalData || !this.modifiedData) return [];
                const differences = [];
                for (let i = 0; i < this.originalData.length; i++) {
                    if (this.originalData[i] !== this.modifiedData[i]) {
                        differences.push({
                            offset: i,
                            original: this.originalData[i],
                            modified: this.modifiedData[i]
                        });
                    }
                }
                return differences;
            }
        }
        function saveToDownloadsFolder(data, fileName, mimeType) {
            return new Promise((resolve, reject) => {
                // Try to use externalRootDirectory (public Downloads)
                const downloadPath = cordova.file.externalRootDirectory;
                
                if (!downloadPath) {
                    reject(new Error('Downloads folder not accessible'));
                    return;
                }
                const fullPath = downloadPath + 'Download/';
                console.log('Trying to save to:', fullPath);
                window.resolveLocalFileSystemURL(fullPath, 
                    function(dirEntry) {
                        dirEntry.getFile(fileName, {create: true, exclusive: false}, 
                            function(fileEntry) {
                                fileEntry.createWriter(function(writer) {
                                    writer.onwriteend = function() {
                                        console.log('Saved to Downloads:', fileEntry.nativeURL);
                                        resolve({
                                            success: true,
                                            path: fileEntry.nativeURL,
                                            fileName: fileName,
                                            inDownloads: true
                                        });
                                    };
                                    writer.onerror = function(e) {
                                        console.error('Error writing file:', e);
                                        reject(e);
                                    };
                                    
                                    const blob = new Blob([data], {type: mimeType});
                                    writer.write(blob);
                                }, reject);
                            }, reject);
                    }, function(e) {
                        console.error('No access to Downloads:', e);
                        reject(e);
                    });
            });
        }
        function saveFileCordova(data, fileName, mimeType) {
            return new Promise((resolve, reject) => {
                if (!isCordovaReady || !window.cordova || !window.cordova.file) {
                    reject(new Error('Cordova not available'));
                    return;
                }
                // Use external cache directory (always works)
                const saveDir = cordova.file.externalCacheDirectory || 
                               cordova.file.cacheDirectory ||
                               cordova.file.dataDirectory;
                
                if (!saveDir) {
                    reject(new Error('No directory available'));
                    return;
                }
                console.log('Saving to:', saveDir);
                window.resolveLocalFileSystemURL(saveDir, 
                    function(dirEntry) {
                        dirEntry.getFile(fileName, {create: true, exclusive: false}, 
                            function(fileEntry) {
                                fileEntry.createWriter(function(writer) {
                                    writer.onwriteend = function() {
                                        console.log('File saved:', fileEntry.nativeURL);
                                        
                                        resolve({
                                            success: true,
                                            path: fileEntry.nativeURL,
                                            fileName: fileName
                                        });
                                    };
                                    writer.onerror = function(e) {
                                        console.error('Error writing file:', e);
                                        reject(e);
                                    };
                                    
                                    const blob = new Blob([data], {type: mimeType});
                                    writer.write(blob);
                                }, function(e) {
                                    console.error('Error createWriter:', e);
                                    reject(e);
                                });
                            }, function(e) {
                                console.error('Error getFile:', e);
                                reject(e);
                            });
                    }, function(e) {
                        console.error('Error resolveURL:', e);
                        reject(e);
                    });
            });
        }
        function shareFile(fileURL, fileName, mimeType) {
            return new Promise((resolve, reject) => {
                if (window.plugins && window.plugins.socialsharing) {
                    // Usar Social Sharing plugin - abre menu para escolher destino
                    window.plugins.socialsharing.shareWithOptions({
                        message: null,
                        subject: fileName,
                        files: [fileURL],
                        chooserTitle: 'Save file as...'
                    }, function(result) {
                        console.log('Share result:', result);
                        resolve(result);
                    }, function(error) {
                        console.log('Share error:', error);
                        reject(error);
                    });
                } else {
                    reject(new Error('Sharing plugin not available'));
                }
            });
        }
        function saveFileBrowser(data, fileName, mimeType) {
            return new Promise((resolve, reject) => {
                try {
                    const blob = new Blob([data], { type: mimeType });
                    
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = fileName;
                    
                    document.body.appendChild(a);
                    a.click();
                    
                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 1000);
                    
                    resolve({ success: true, fileName: fileName, method: 'blob' });
                } catch (error) {
                    // Fallback base64
                    try {
                        let binary = '';
                        const bytes = new Uint8Array(data);
                        for (let i = 0; i < bytes.length; i++) {
                            binary += String.fromCharCode(bytes[i]);
                        }
                        const base64 = window.btoa(binary);
                        const dataUrl = `data:${mimeType};base64,${base64}`;
                        
                        const a = document.createElement('a');
                        a.href = dataUrl;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        
                        resolve({ success: true, fileName: fileName, method: 'base64' });
                    } catch (e2) {
                        reject(e2);
                    }
                }
            });
        }
        async function downloadFile(data, fileName, mimeType = 'application/octet-stream') {
            updateStatus('💾 Preparing file...');
            
            // Tentar Cordova
            if (isCordovaReady && window.cordova && window.cordova.file) {
                
                // 1. First try to save directly to Downloads folder
                if (cordova.file.externalRootDirectory) {
                    try {
                        updateStatus('📁 Saving to Downloads...');
                        const result = await saveToDownloadsFolder(data, fileName, mimeType);
                        updateStatus(`✅ Saved to Downloads: ${fileName}`);
                        alert(`✅ File saved!\n\n📄 ${fileName}\n\n📁 Location: Downloads`);
                        return result;
                    } catch (dlError) {
                        console.log('Could not save to Downloads:', dlError);
                        // Continue to alternative method
                    }
                }
                // 2. If that fails, save to cache and open share menu
                try {
                    const result = await saveFileCordova(data, fileName, mimeType);
                    updateStatus('📤 Opening share menu...');
                    
                    // Now open share menu
                    try {
                        await shareFile(result.path, fileName, mimeType);
                        updateStatus(`✅ File shared: ${fileName}`);
                    } catch (shareError) {
                        // If sharing fails, show where the file is located
                        updateStatus(`✅ File saved`);
                        alert(`✅ File saved!\n\n📄 ${fileName}\n\n📁 Location:\n${result.path}\n\n💡 Use the share menu to save to Downloads.`);
                    }
                    return result;
                } catch (e) {
                    console.log('Cordova failed:', e);
                    updateStatus('⚠️ Trying alternative method...');
                }
            }
            
            // Browser fallback
            try {
                const result = await saveFileBrowser(data, fileName, mimeType);
                updateStatus(`✅ Download: ${fileName}`);
                alert(`📥 Download started!\n\n${fileName}`);
                return result;
            } catch (e) {
                updateStatus('❌ Error');
                alert(`❌ Error: ${e.message}`);
                throw e;
            }
        }
        
        const processor = new ECU_Processor();
        let processResult = null;
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        uploadArea.addEventListener('click', () => fileInput.click());
        // Drag & Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, e => {
                e.preventDefault();
                e.stopPropagation();
            });
        });
        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => {
                uploadArea.classList.add('drag-active');
            });
        });
        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => {
                uploadArea.classList.remove('drag-active');
            });
        });
        uploadArea.addEventListener('drop', e => {
            const files = e.dataTransfer.files;
            if (files.length > 0) handleFile(files[0]);
        });
        fileInput.addEventListener('change', e => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });
        async function handleFile(file) {
            if (file.size > 600 * 1024) {
                alert('❌ File too large! Maximum 600KB');
                return;
            }
            
            if (file.size < 1024) {
                alert('❌ File too small!');
                return;
            }
            try {
                updateStatus('📂 Loading file...');
                document.getElementById('loader').style.display = 'block';
                
                await processor.loadFile(file);
                const analysis = processor.analyze();
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('fileSize').textContent = (file.size / 1024).toFixed(2) + ' KB';
                document.getElementById('fileInfo').classList.remove('hidden');
                showAnalysis(analysis);
                processBtn.disabled = false;
                
                updateStatus('✅ File loaded! Select operations.');
                document.getElementById('loader').style.display = 'none';
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error: ' + error.message);
                updateStatus('❌ Error loading file');
                document.getElementById('loader').style.display = 'none';
            }
        }
        function showAnalysis(analysis) {
            const content = document.getElementById('analysisContent');
            let html = `<div class="result-item">
                <strong>🔐 IMMO:</strong> ON: ${analysis.immo.on} | OFF: ${analysis.immo.off}
            </div>`;
            if (analysis.ecuInfo) {
                html += `<div class="result-item">
                    <strong>📊 ECU:</strong> ${analysis.ecuInfo.ecuType}<br>
                    <strong>Part:</strong> ${analysis.ecuInfo.partNumber}
                </div>`;
            }
            content.innerHTML = html;
            document.getElementById('analysisResults').classList.add('show');
        }
        // Process
        processBtn.addEventListener('click', () => {
            const immoMode = document.querySelector('input[name="immo"]:checked').value;
            
            const selectedOptions = Array.from(document.getElementById('commonDtcSelect').selectedOptions)
                .map(opt => opt.value);
            
            const customInput = document.getElementById('customDtcInput').value.trim();
            const customDtcs = customInput ? customInput.split(',').map(c => c.trim()).filter(c => c) : [];
            const selectedDtcs = [...new Set([...selectedOptions, ...customDtcs])];
            if (immoMode === 'none' && selectedDtcs.length === 0) {
                alert('⚠️ Select at least one operation!');
                return;
            }
            const operations = [];
            if (immoMode === 'off') operations.push('IMMO OFF');
            if (immoMode === 'on') operations.push('IMMO ON');
            if (selectedDtcs.length > 0) operations.push(`DTC OFF (${selectedDtcs.length})`);
            if (!confirm(`Apply?\n\n${operations.join('\n')}\n\n⚠️ Fix the checksum afterwards!`)) {
                return;
            }
            try {
                document.getElementById('loader').style.display = 'block';
                updateStatus('⚙️ Processing...');
                processResult = processor.process({
                    immoMode: immoMode,
                    dtcCodes: selectedDtcs
                });
                showProcessResults(processResult);
                updateStatus('✅ Processing complete! Save the file.');
                document.getElementById('loader').style.display = 'none';
            } catch (error) {
                alert('❌ Error: ' + error.message);
                updateStatus('❌ Error during processing');
                document.getElementById('loader').style.display = 'none';
            }
        });
        function showProcessResults(result) {
            const content = document.getElementById('processContent');
            const differences = processor.getDifferences();
            content.innerHTML = `
                <div class="result-item">
                    <strong>✅ Operations:</strong> ${result.operations.join(', ')}<br>
                    <strong>📝 Patches:</strong> ${result.patchesApplied}<br>
                    <strong>🔄 Bytes changed:</strong> ${differences.length}
                </div>
            `;
            document.getElementById('processResults').classList.add('show');
        }
        // Download Buttons
        document.getElementById('downloadBtn').addEventListener('click', async () => {
            if (!processResult || !processor.modifiedData) {
                alert('⚠️ Process a file first!');
                return;
            }
            
            const fileName = processor.getModifiedFileName(processResult.operations);
            await downloadFile(processor.modifiedData, fileName, 'application/octet-stream');
        });
        document.getElementById('downloadReportBtn').addEventListener('click', async () => {
            if (!processResult) {
                alert('⚠️ Process a file first!');
                return;
            }
            
            const report = processor.generateReport(processResult.operations, processResult.patchesApplied);
            const baseName = processor.fileName.replace(/\.[^/.]+$/, '');
            const reportName = `${baseName}_REPORT.txt`;
            
            const encoder = new TextEncoder();
            const data = encoder.encode(report);
            await downloadFile(data, reportName, 'text/plain');
        });
    </script>
</body>
</html>
